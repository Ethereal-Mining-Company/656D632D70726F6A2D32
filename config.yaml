test_mode: false

paths:
  digits_dataset: "data/digits_dataset.csv"
  xor_dataset: "data/xor_dataset.csv"
  model_dir: "artifacts"
  log_dir: "logs"
  log_file: "experiment_results.csv"

features:
  target_col: "target_digit"

evaluation_params:
  test_size: 0.2
  cv_folds: 5
  global_seed: 42

models:
  knn:
    module_path: "sklearn.neighbors"
    class_name: "KNeighborsClassifier"
    dataset_key: "digits_dataset"
    target_col: "target_digit"
    params:
      n_neighbors: [3, 5, 7]
      weights: ["uniform", "distance"]

  svc:
    module_path: "sklearn.svm"
    class_name: "SVC"
    dataset_key: "digits_dataset"
    target_col: "target_digit"
    params:
      C: [0.1, 1, 10]
      gamma: ["scale", "auto"]

  gnb:
    module_path: "sklearn.naive_bayes"
    class_name: "GaussianNB"
    dataset_key: "digits_dataset"
    target_col: "target_digit"
    params:
      var_smoothing: [1.0e-9, 1.0e-7, 1.0e-5]

  xor_mlp:
    module_path: "src.pipeline"
    class_name: "build_xor_mlp"
    dataset_key: "xor_dataset"
    target_col: "target_xor"
    skip_split: true
    skip_kfold: true
    fit_params:
      epochs: 500
      batch_size: 4
      verbose: 0
    params:
      hidden_units: [4, 8]
      hidden_activation: ["relu", "tanh"]
      learning_rate: [0.01, 0.05]